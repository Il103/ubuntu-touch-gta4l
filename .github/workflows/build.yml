name: Build Ubuntu Touch (T505N Final Alpha)

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # 1. تفضية مساحة السيرفر لـ 60 جيجا سواب
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 15360
          swap-size-mb: 61440
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      # 2. تسريع النظام
      - name: Turbo-Charge OS
        run: |
          sudo sysctl -w vm.swappiness=100
          sudo sysctl -w fs.file-max=2097152
          sudo sysctl -w fs.pipe-max-size=1048576
          free -h

      - name: Checkout Code
        uses: actions/checkout@v4

      # 3. تثبيت كل المكتبات الناقصة
      - name: Install All-In-One Dependencies
        run: |
          sudo apt update
          sudo apt install -y android-tools-mkbootimg bc bison build-essential ca-certificates cpio curl \
          device-tree-compiler fakeroot flex git kmod libssl-dev libtinfo5 python2 python3 python3-dev \
          sudo unzip wget xz-utils zstd libncurses5-dev libncursesw5-dev lz4 liblz4-tool \
          libelf-dev gcc-multilib g++-multilib libxml2-utils expat libexpat1-dev \
          pkg-config libarchive-tools rsync --no-install-recommends
          sudo apt clean
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      # 4. حقن إعدادات الكيرنل لضمان الـ Boot في سامسونج
      - name: Patch Kernel Configs
        run: |
          echo "Injecting DEVTMPFS for Galaxy Tab A7 (T505N)..."
          find . -name "*defconfig*" -exec sh -c 'echo "CONFIG_DEVTMPFS=y" >> {}' \;
          find . -name "*defconfig*" -exec sh -c 'echo "CONFIG_DEVTMPFS_MOUNT=y" >> {}' \;
          sed -i 's/make/make -j$(nproc)/g' build.sh || true
          chmod +x build.sh

      # 5. عملية البناء الأساسية
      - name: Build device tarball
        run: |
          if ! grep -q "deviceinfo_kernel_source" deviceinfo; then
            echo "❌ Error: Kernel source URL is missing in deviceinfo file!"
            exit 1
          fi
          ./build.sh -b workdir 2>&1 | tee build.log
        continue-on-error: false

      # 6. التكملة: تحويل الناتج لصور قابلة للتفليش (Crucial Step)
      - name: Create Final Flashable Images
        if: success()
        run: |
          sudo apt update && sudo apt install -y fakeroot git img2simg jq sudo wget xz-utils zstd
          git clone https://github.com/NotKit/halium-generic-adaptation-build-tools.git -b wseries build_tools
          # تجهيز ملفات الـ OTA الوهمية
          ./build_tools/prepare-fake-ota.sh out/device_gta4l.tar.xz workdir/fake-ota
          mkdir -p out_final
          # استخراج الـ system image
          fakeroot ./build_tools/system-image-from-ota.sh workdir/fake-ota/ubuntu_command out_final
          mv out_final/rootfs.img out_final/ubuntu.img
          # ضغط النسخة بأعلى تقنية لتقليل المساحة
          zstd -15 -T0 out_final/ubuntu.img -o out_final/ubuntu.img.zst
          mv out_final/boot.img out_final/boot-T505N.img

      # 7. رفع الصور النهائية للـ Artifacts
      - name: Upload Final Images
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: T505N-Flashable-Images
          path: |
            out_final/boot-T505N.img
            out_final/ubuntu.img.zst

      # 8. رفع اللوج في حالة الفشل (عشان لو ضرب نعرف ليه)
      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: build.log

      # 9. الحركة النهائية: عمل Release رسمي (اختياري بس هيفيدك)
      - name: Create Release
        if: success() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            out_final/boot-T505N.img
            out_final/ubuntu.img.zst
          name: Ubuntu Touch for T505N (Stable Build)
          tag_name: ${{ github.ref_name }}
          body: "Stable Ubuntu Touch Build for Samsung Galaxy Tab A7 (LTE)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
