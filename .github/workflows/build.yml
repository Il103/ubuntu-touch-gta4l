name: Build Ubuntu Touch images

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # 1. بنوسع الهارد ونعمل سواب 12 جيجا قبل أي حاجة
      - name: Maximize Build Space (The Beast Mode)
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 20480 
          swap-size-mb: 12288     
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      # 2. بننزل الكود في المساحة الجديدة
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install build tools
        run: |
          sudo apt update
          sudo apt install android-tools-mkbootimg bc bison build-essential ca-certificates cpio curl device-tree-compiler fakeroot flex git kmod libssl-dev libtinfo5 python2 sudo unzip wget xz-utils zstd -y --no-install-recommends
          sudo apt clean
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Fix Permissions
        run: chmod +x build.sh

      # 3. أمر البناء الصافي من غير فلسفة زيادة عشان السكريبت ميزعلش
      - name: Build device tarball
        run: |
          ./build.sh -b workdir

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: device-tarball
          path: out/device_gta4l.tar.xz

  devel-flashable:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Space for Images
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 10240
          swap-size-mb: 8192

      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Download device tarball
        uses: actions/download-artifact@v4
        with:
          name: device-tarball
          path: out

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y fakeroot git img2simg jq sudo wget xz-utils
          sudo apt clean

      - name: Clone halium tools
        run: git clone https://github.com/NotKit/halium-generic-adaptation-build-tools.git -b wseries build

      - name: Create flashable images
        run: |
          ./build/prepare-fake-ota.sh out/device_gta4l.tar.xz workdir/fake-ota
          mkdir -p out
          fakeroot ./build/system-image-from-ota.sh workdir/fake-ota/ubuntu_command out
          mv out/rootfs.img out/ubuntu.img
          zstd -T0 out/ubuntu.img

      - name: Release and Upload
        if: github.event_name == 'push'
        run: |
            git fetch --tags
            TAG_NAME=$(git tag --points-at HEAD | head -n1)
            if [ -z "$TAG_NAME" ]; then
                echo "No tag found. Just uploading artifact."
                exit 0
            fi
            mv out/ubuntu.img.zst ubuntu-gta4l.img.zst
            mv out/boot.img boot-gta4l.img
            gh release create "$TAG_NAME" ubuntu-gta4l.img.zst boot-gta4l.img --clobber || \
                gh release upload "$TAG_NAME" ubuntu-gta4l.img.zst boot-gta4l.img --clobber
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
