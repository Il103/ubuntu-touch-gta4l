name: Build Ubuntu Touch (T505N Final Alpha)

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # 1. المرحلة القصوى: 60 جيجا سواب (أعلى رقم آمن للسيرفر)
      - name: Maximize Build Space (The Beast Mode)
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 15360   # سبنا 15 جيجا للنظام
          swap-size-mb: 61440      # 60 جيجا سواب (إجمالي رامات 75 جيجا!)
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      # 2. حقنة سرعة للمعالج والذاكرة
      - name: Turbo-Charge OS
        run: |
          sudo sysctl -w vm.swappiness=100
          sudo sysctl -w fs.file-max=10000000
          sudo sysctl -w fs.pipe-max-size=1048576
          ulimit -n 1048576
          free -h

      - name: Checkout Code
        uses: actions/checkout@v4

      # 3. ترسانة الـ 2000 مكتبة (كل ما يحتاجه تابلت سامسونج)
      - name: Install All-In-One Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
          android-tools-mkbootimg bc bison build-essential ca-certificates cpio curl \
          device-tree-compiler fakeroot flex git kmod libssl-dev libtinfo5 python2 python3 python3-dev \
          sudo unzip wget xz-utils zstd libncurses5-dev libncursesw5-dev lz4 liblz4-tool \
          libelf-dev gcc-multilib g++-multilib libxml2-utils expat libexpat1-dev \
          libgl1-mesa-dev gperf libxml2 lib32z1-dev libghc-bzlib-dev \
          imagemagick liblzma-dev libglib2.0-dev libpixman-1-dev \
          libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev \
          lib32readline-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
          xsltproc unzip fontconfig maven schedtool libssl-dev \
          lib32ncurses-dev libncurses5 pkg-config libarchive-tools \
          rsync adb fastboot python3-pip zip unzip --no-install-recommends
          sudo apt clean
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      # 4. تريكة الـ T505N لضمان الـ Boot
      - name: Patch Kernel Configs
        run: |
          echo "Injecting DEVTMPFS for T505N..."
          find . -name "*defconfig*" -exec sh -c 'echo "CONFIG_DEVTMPFS=y" >> {}' \;
          find . -name "*defconfig*" -exec sh -c 'echo "CONFIG_DEVTMPFS_MOUNT=y" >> {}' \;
          # تسريع الماك لـ جوبز متوازية
          sed -i 's/make/make -j$(nproc)/g' build.sh || true
          chmod +x build.sh

      # 5. البناء (السرعة "فشيخة" بـ Parallel Jobs)
      - name: Build device tarball
        run: |
          ./build.sh -b workdir 2>&1 | tee build.log
        continue-on-error: false

      # 6. صيد الإيرور (لو حصلت أي حركة غدر)
      - name: Ultimate Error Diagnosis
        if: failure()
        run: |
          echo "🔎 Searching for the killer in logs..."
          grep -i -B 50 -A 20 "error" build.log || tail -n 500 build.log

      # 7. تحويل الـ Tarball لصور قابلة للتفليش (Flashable)
      - name: Create Final Flashable Images
        if: success()
        run: |
          sudo apt update && sudo apt install -y fakeroot git img2simg jq sudo wget xz-utils zstd
          git clone https://github.com/NotKit/halium-generic-adaptation-build-tools.git -b wseries build_tools
          ./build_tools/prepare-fake-ota.sh out/device_gta4l.tar.xz workdir/fake-ota
          mkdir -p out_final
          fakeroot ./build_tools/system-image-from-ota.sh workdir/fake-ota/ubuntu_command out_final
          mv out_final/rootfs.img out_final/ubuntu.img
          zstd -15 -T0 out_final/ubuntu.img -o out_final/ubuntu.img.zst
          mv out_final/boot.img out_final/boot-T505N.img

      # 8. الرفع النهائي (Artifacts & Release)
      - name: Upload Final Images
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: T505N-Flashable-Images
          path: |
            out_final/boot-T505N.img
            out_final/ubuntu.img.zst

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release create "${{ github.ref_name }}" \
            out_final/boot-T505N.img \
            out_final/ubuntu.img.zst \
            --title "Ubuntu Touch Stable for T505N" \
            --notes "Stable Build - 60GB Swap - T505N Specific Fixes" \
            --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
